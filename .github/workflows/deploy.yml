name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Build the customer booking app (served at the site root). The operator
      # dashboard link points at the /operator/ sub-path below.
      - run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_OPERATOR_URL: ${{ vars.VITE_OPERATOR_URL || '/whale-watching-booking-engine/operator/' }}
      # Build the operator dashboard (served under /operator/).
      - run: npm run build -w operator
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # Assemble one static site: booking app at root, operator under /operator/.
      - run: |
          rm -rf site
          mkdir -p site/operator
          cp -r frontend/dist/. site/
          cp -r operator/dist/. site/operator/
      - uses: actions/configure-pages@v5
        with:
          # Enable GitHub Pages via the API on first run so no manual UI step is needed
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
